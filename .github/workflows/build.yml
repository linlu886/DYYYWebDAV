name: Build DYYYWebDAV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-rootless:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.3

      - name: Build rootless package
        shell: bash
        run: |
          set -e
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: List packages
        shell: bash
        run: |
          set -e
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: DYYYWebDAV-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30